name: Sensee
description: >-
  Sensee is a French direct-to-consumer online optician and contact-lens
  retailer, operating since 2005 and run by licensed opticians. It sells
  contact lenses, lens-care solutions, eye-health products and eyewear across
  six European markets (France, Germany, Italy, Spain, Switzerland and Austria)
  under localized storefronts, and supports third-party insurance payment
  (tiers payant) via networks such as Kalixia, Santeclair, Almerys and Optilys.
  Sensee is a subsidiary of Vision Group Holding AG. It was surfaced as a
  portfolio company of Partech and added to the API Evangelist network for
  enrichment; the enrichment pass found no public API, SDK or developer
  program, only a corporate security.txt / responsible-disclosure surface.
